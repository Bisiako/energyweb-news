<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il mio blog</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #222; }
  nav { display: flex; flex-direction: column; gap: 6px; margin-bottom: 30px; }
  nav a { text-decoration: none; color: #0b5fa5; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; }
  nav a:hover { background: #f5f5f5; }
  #content { line-height: 1.7; }
  #content img { max-width: 100%; }
  #back { margin-top: 20px; cursor: pointer; background: none; border: 1px solid #ccc; padding: 6px 12px; border-radius: 6px; }
  .meta { color: #888; font-size: 13px; margin-bottom: 20px; }
</style>
</head>
<body>

<h1>Il mio blog</h1>
<nav id="nav"></nav>
<div id="content"></div>

<script>
/*
  ISTRUZIONI D'USO
  1. Crea una cartella "posts/" nel repo.
  2. Dentro, aggiungi "index.json" con l'elenco dei post (vedi POSTS_URL sotto).
  3. Aggiungi un file .md per ogni post, con lo stesso "slug" indicato in index.json.
  4. Pubblica tutto su GitHub Pages. Fine: nessuna build, nessun tool esterno.
*/

const POSTS_URL = "posts/index.json"; // elenco dei post: [{ "slug": "...", "title": "...", "date": "..." }]

const nav = document.getElementById("nav");
const content = document.getElementById("content");

// Carica l'elenco dei post e costruisce il menu
async function loadIndex() {
  try {
    const res = await fetch(POSTS_URL);
    const posts = await res.json();
    nav.innerHTML = posts.map(p =>
      `<a href="#/post/${p.slug}" data-slug="${p.slug}">${p.title} <span style="color:#aaa">(${p.date})</span></a>`
    ).join("");
    showIntroOrRoute();
  } catch (e) {
    nav.innerHTML = "<p>Impossibile caricare posts/index.json</p>";
  }
}

// Carica e renderizza un singolo articolo markdown
async function loadPost(slug) {
  content.innerHTML = "<p>Caricamento...</p>";
  try {
    const res = await fetch(`posts/${slug}.md`);
    if (!res.ok) throw new Error("Post non trovato");
    const md = await res.text();
    content.innerHTML = marked.parse(md) +
      `<button id="back">&larr; Torna all'elenco</button>`;
    document.getElementById("back").addEventListener("click", () => {
      history.pushState({}, "", location.pathname);
      content.innerHTML = "";
    });
  } catch (e) {
    content.innerHTML = "<p>Errore nel caricamento dell'articolo.</p>";
  }
}

// Gestisce il routing via hash, senza reload della pagina
function showIntroOrRoute() {
  const match = location.hash.match(/^#\/post\/(.+)$/);
  if (match) {
    loadPost(match[1]);
  } else {
    content.innerHTML = "<p>Seleziona un articolo dal menu.</p>";
  }
}

// Intercetta i click sui link del menu
nav.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-slug]");
  if (!a) return;
  e.preventDefault();
  location.hash = `#/post/${a.dataset.slug}`;
  loadPost(a.dataset.slug);
});

// Supporto tasti avanti/indietro del browser
window.addEventListener("popstate", showIntroOrRoute);
window.addEventListener("hashchange", showIntroOrRoute);

loadIndex();
</script>

</body>
</html>
